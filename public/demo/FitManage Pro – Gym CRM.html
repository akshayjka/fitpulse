<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FitManage Pro – Gym CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--card:#16232d;--tx:#e8eef2;--mu:#8fa2b0;--bd:#26364290;--pr2:#12363d;--okb:#12351f;--wab:#3a2c0e;--erb:#3d1717;--ok:#4ade80;--wa:#fbbf24;--er:#f87171}}
:root[data-theme="dark"]{--bg:#0f1a22;--card:#16232d;--tx:#e8eef2;--mu:#8fa2b0;--bd:#263642;--pr2:#12363d;--okb:#12351f;--wab:#3a2c0e;--erb:#3d1717;--ok:#4ade80;--wa:#fbbf24;--er:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%;margin:0}body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
.app{display:grid;grid-template-columns:210px 1fr;height:100%}aside{background:var(--card);border-right:1px solid var(--bd);padding:16px 12px;overflow:auto}
.logo{font-weight:700;font-size:17px;color:var(--pr);padding:4px 8px 16px}nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--mu);font-weight:500;cursor:pointer;margin-bottom:2px;white-space:nowrap}
nav a.on{background:var(--pr);color:#fff}nav a:hover:not(.on),nav a:focus-visible{background:var(--pr2);color:var(--tx);outline:none}
main{overflow:auto;display:flex;flex-direction:column;min-height:0}.top{display:flex;gap:12px;align-items:center;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--bd)}.top input{flex:1;max-width:360px}.sp{flex:1}
#v{padding:20px 24px;max-width:1240px;width:100%}h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 12px}.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px;flex-wrap:wrap}
.g{display:grid;gap:16px;margin-bottom:16px}.g2{grid-template-columns:1.3fr 1fr}.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;min-width:0}.k{background:var(--pr2);border-radius:10px;padding:14px}.k b{display:block;font-size:22px;margin-top:4px}.k span{color:var(--mu);font-size:12px}
input,select,textarea,button{font:inherit;color:inherit}input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
.b,.b2,.bs{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;background:var(--pr);color:#fff}.b2{background:var(--pr2);color:var(--pr)}.bs{padding:4px 9px;font-size:12px;background:var(--pr2);color:var(--pr)}.bs.d{background:var(--erb);color:var(--er)}
.tb{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tb input{max-width:260px}.tb select{width:auto}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:600;font-size:12px;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}td .bs{margin:1px}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;margin-right:8px;vertical-align:middle}.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.Active{background:var(--okb);color:var(--ok)}.Expiring{background:var(--wab);color:var(--wa)}.Expired{background:var(--erb);color:var(--er)}.Frozen{background:var(--pr2);color:var(--pr)}
.mu{color:var(--mu)}.em{padding:24px;text-align:center;color:var(--mu)}.fi{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.fi:last-child{border:0}.fi small{display:block;color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal b{font-size:11px;color:var(--mu)}.cal button{border:0;background:none;border-radius:6px;padding:7px 0;cursor:pointer;position:relative}.cal .t{outline:1px solid var(--pr)}.cal .s{background:var(--pr);color:#fff}.cal .o{opacity:.35}.cal .h:after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--pr)}.cal .s.h:after{background:#fff}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ch button{border:1px solid var(--bd);background:none;border-radius:6px;cursor:pointer;padding:3px 9px}
.qa{display:grid;gap:8px}.qa .b{padding:11px}.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}.tabs .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.pb{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:4px}.pb i{display:block;height:100%;background:var(--pr)}.kb{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto}.kc{background:var(--bg);border-radius:10px;padding:10px;min-height:120px}.kc .c{padding:10px;margin-bottom:8px}.kc h3{font-size:13px;margin:0 0 8px}
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:9}.modal{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:440px;max-height:92%;overflow:auto}.modal label{display:block;margin-bottom:10px;font-weight:600;font-size:13px}.modal label input,.modal label select,.modal label textarea{margin-top:4px;font-weight:400}.er{color:var(--er);font-weight:400;display:block;min-height:0}.ra{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;display:none}#toast.e{background:var(--er);color:#fff}
@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:6px}.logo{display:none}nav{display:flex;gap:4px}.g2{grid-template-columns:1fr}.top,#v{padding-left:12px;padding-right:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app"><aside><div class="logo">⚡ FitManage Pro</div><nav id="nav"></nav></aside>
<main><div class="top"><input id="gs" placeholder="Search members by name or phone…" aria-label="Search members"><span class="sp"></span><button class="b2" data-a="bell" id="bell" aria-label="Renewals due">🔔 <span id="bc">0</span></button><b>Admin</b></div><div id="v"></div></main></div>
<div id="toast" role="status"></div>
<script>
const K='fitmanage_pro_v1',$=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const T=()=>iso(new Date()),D=s=>new Date(s+'T00:00:00');
const addD=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const addM=(s,m)=>{const d=D(s),g=d.getDate();d.setMonth(d.getMonth()+m);if(d.getDate()<g)d.setDate(0);return iso(d)};
const mk=k=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-k);return iso(d).slice(0,7)};
const inr=n=>'₹'+Number(n).toLocaleString('en-IN'),uid=p=>p+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const df=s=>D(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' hr ago':Math.round(m/1440)+' days ago'};
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],STG=['New','Contacted','Trial Booked','Won','Lost'];
let db,ui={q:'',sf:'all',cal:{y:new Date().getFullYear(),m:new Date().getMonth()},sel:T(),day:new Date().getDay()},M,CB;
function seed(){const t=T();
const plans=[{id:'p1',name:'Monthly',price:1500,months:1},{id:'p2',name:'Quarterly',price:4000,months:3},{id:'p3',name:'Annual',price:12000,months:12}];
const trainers=[['Arjun Rao','Strength'],['Meera Nair','Yoga'],["Sam D'Souza",'HIIT'],['Priya Shah','Zumba']].map((x,i)=>({id:'t'+(i+1),name:x[0],spec:x[1],phone:'98450'+(23456+i*1111)}));
const nm=['Rahul Verma','Ananya Iyer','Karthik Reddy','Sneha Kulkarni','Vikram Singh','Divya Menon','Aditya Joshi','Pooja Nambiar','Rohan Mehta','Isha Kapoor'],off=[-10,3,20,45,-2,90,12,200,5,60],pl=['p1','p1','p2','p2','p1','p3','p1','p3','p2','p2'];
const members=nm.map((n,i)=>{const p=plans.find(x=>x.id==pl[i]),end=addD(t,off[i]);return{id:'m'+(i+1),name:n,phone:'9845'+(100000+i*1111),email:n.split(' ')[0].toLowerCase()+'@example.com',planId:p.id,trainerId:'t'+(i%4+1),start:addM(end,-p.months),end,frozen:i==6,notes:''}});
const payments=members.map((m,i)=>({id:'y'+i,mid:m.id,planId:m.planId,amount:plans.find(p=>p.id==m.planId).price,method:['UPI','Cash','Card'][i%3],date:m.start}));
for(let k=1;k<=5;k++)for(let j=0;j<3;j++)payments.push({id:'h'+k+j,mid:members[(k+j)%10].id,planId:j%2?'p2':'p1',amount:j%2?4000:1500,method:'UPI',date:mk(k)+'-1'+j});
const checkins=[];['m2','m3','m4','m8'].forEach((m,i)=>checkins.push({id:'c'+i,mid:m,date:t,time:'0'+(6+i)+':'+(10+i*7)}));
for(let d=1;d<7;d++)for(let j=0;j<3+d%3;j++)checkins.push({id:'c'+d+j,mid:members[(d*3+j*2)%10].id,date:addD(t,-d),time:'07:'+(10+j*9)});
const classes=[['Morning Strength','t1',1,'06:30',15,['m2','m3']],['Power Yoga','t2',1,'18:00',20,['m4']],['HIIT Blast','t3',3,'07:00',12,['m2','m8']],['Zumba Party','t4',4,'19:00',25,[]],['Strength & Core','t1',5,'06:30',15,['m3']],['Sunday Flow','t2',0,'08:00',20,[]],['HIIT Blast','t3',6,'08:00',12,['m4','m9']],['Morning Strength','t1',2,'06:30',15,[]]].map((c,i)=>({id:'k'+i,name:c[0],trainerId:c[1],day:c[2],time:c[3],cap:c[4],booked:c[5]}));
const leads=[['Nikhil Rao','Instagram','New','p1'],['Tanvi Shetty','Walk-in','New','p2'],['Arun Kumar','Referral','Contacted','p3'],['Meghna Das','Website','Contacted','p1'],['Farhan Ali','Google','Trial Booked','p2'],['Kavya Pillai','Walk-in','Lost','p1']].map((l,i)=>({id:'l'+i,name:l[0],phone:'9900'+(200000+i*777),email:'',source:l[1],stage:l[2],planId:l[3],notes:''}));
const n=Date.now(),feed=[{t:n-6e5,text:'Ananya Iyer checked in'},{t:n-36e5,text:'Payment of ₹4,000 received from Karthik Reddy'},{t:n-72e5,text:'New lead Tanvi Shetty added from Walk-in'},{t:n-864e5,text:'Class HIIT Blast is almost full'}];
return{plans,trainers,members,payments,checkins,classes,leads,feed}}
function load(){try{const s=localStorage.getItem(K);if(s){db=JSON.parse(s);if(db&&db.members)return}}catch(e){}db=seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
const log=t=>{db.feed.unshift({t:Date.now(),text:t});db.feed=db.feed.slice(0,30)};
const mem=id=>db.members.find(m=>m.id==id),plan=id=>db.plans.find(p=>p.id==id),trn=id=>db.trainers.find(t=>t.id==id);
const st=m=>m.frozen?'Frozen':m.end<T()?'Expired':m.end<=addD(T(),7)?'Expiring':'Active';
const av=n=>`<span class="av" style="background:hsl(${[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360} 50% 42%)">${esc(n.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span>`;
const bdg=s=>`<span class="bd ${s}">${s}</span>`;
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function modal(h){close();M=document.createElement('div');M.className='ov';M.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+h+'</div>';document.body.appendChild(M);M.onclick=e=>{if(e.target==M)close()};const f=M.querySelector('input,select,button');f&&f.focus()}
function close(){M&&M.remove();M=null}
document.addEventListener('keydown',e=>{if(e.key=='Escape')close()});
function ask(msg,cb){CB=cb;modal(`<h2>Are you sure?</h2><p>${esc(msg)}</p><div class="ra"><button class="b2" data-a="close">Cancel</button><button class="b" data-a="yes">Yes, continue</button></div>`)}
function form(title,fields,vals,onSave,btn){
const h=fields.map(f=>{const v=vals[f.k]??f.d??'';let i;
if(f.t=='select')i=`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}"${String(o[0])==String(v)?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
else if(f.t=='area')i=`<textarea name="${f.k}" rows="2">${esc(v)}</textarea>`;
else i=`<input name="${f.k}" type="${f.t||'text'}" value="${esc(v)}"${f.t=='number'?' min="0" step="any"':''}>`;
return`<label>${f.l}${f.r?' *':''}${i}<small class="er" data-e="${f.k}"></small></label>`}).join('');
modal(`<h2>${title}</h2><form novalidate>${h}<div class="ra"><button type="button" class="b2" data-a="close">Cancel</button><button class="b">${btn||'Save'}</button></div></form>`);
const fm=M.querySelector('form');
fm.onsubmit=e=>{e.preventDefault();const o={};let ok=true;
fields.forEach(f=>{const v=fm.elements[f.k].value.trim();let m='';
if(f.r&&!v)m='This field is required';
else if(v&&f.t=='tel'&&!/^\d{10}$/.test(v))m='Enter a 10-digit phone number';
else if(v&&f.t=='email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))m='Enter a valid email address';
else if(v&&f.t=='number'&&!(+v>0))m='Enter a number greater than 0';
fm.querySelector(`[data-e="${f.k}"]`).textContent=m;if(m)ok=false;o[f.k]=f.t=='number'&&v?+v:v});
if(ok&&onSave(o)!==false)close()}}
const planOpts=()=>db.plans.map(p=>[p.id,`${p.name} – ${inr(p.price)}`]),trnOpts=()=>[['','No trainer'],...db.trainers.map(t=>[t.id,t.name])];
function memberForm(id,pre){const m=id?mem(id):null,isN=!m;
const f=[{k:'name',l:'Full name',r:1},{k:'phone',l:'Phone',t:'tel',r:1},{k:'email',l:'Email',t:'email'},{k:'planId',l:'Plan',t:'select',o:planOpts()},{k:'trainerId',l:'Trainer',t:'select',o:trnOpts()}];
if(isN)f.push({k:'start',l:'Start date',t:'date',r:1,d:T()},{k:'pay',l:'First payment',t:'select',o:[['cash','Collected now (cash)'],['upi','Collected now (UPI)'],['later','Collect later']]});else f.push({k:'end',l:'Expiry date',t:'date',r:1});
f.push({k:'notes',l:'Notes',t:'area'});
form(isN?'Add member':'Edit member',f,m||pre||{},o=>{
if(db.members.some(x=>x.phone==o.phone&&x.id!=id)){toast('A member with this phone number already exists',1);return false}
if(isN){const p=plan(o.planId),nm={id:uid('m'),name:o.name,phone:o.phone,email:o.email,planId:p.id,trainerId:o.trainerId,start:o.start,end:addM(o.start,p.months),frozen:false,notes:o.notes};db.members.push(nm);
if(o.pay!='later')db.payments.push({id:uid('y'),mid:nm.id,planId:p.id,amount:p.price,method:o.pay=='cash'?'Cash':'UPI',date:T()});
if(pre&&pre.leadId){const l=db.leads.find(x=>x.id==pre.leadId);if(l)l.stage='Won'}log(`New member ${o.name} joined (${p.name})`)}
else Object.assign(m,{name:o.name,phone:o.phone,email:o.email,planId:o.planId,trainerId:o.trainerId,end:o.end,notes:o.notes});
save();render();toast(isN?'Member added':'Member updated')},isN?'Add member':'Save changes')}
function payForm(mid){if(!db.members.length)return toast('Add a member first',1);const mm=mem(mid)||db.members[0];
form('Record payment',[{k:'mid',l:'Member',t:'select',o:db.members.map(m=>[m.id,m.name])},{k:'planId',l:'Plan',t:'select',o:planOpts()},{k:'amount',l:'Amount (₹)',t:'number',r:1},{k:'method',l:'Method',t:'select',o:['Cash','UPI','Card'].map(x=>[x,x])},{k:'date',l:'Date',t:'date',r:1}],{mid:mm.id,planId:mm.planId,amount:plan(mm.planId).price,date:T()},o=>{
if(o.date>T()){toast('Payment date cannot be in the future',1);return false}
const m=mem(o.mid),p=plan(o.planId),base=m.end>T()?m.end:T();m.end=addM(base,p.months);m.planId=p.id;
db.payments.push({id:uid('y'),mid:m.id,planId:p.id,amount:o.amount,method:o.method,date:o.date});log(`Payment of ${inr(o.amount)} received from ${m.name}`);save();render();toast('Payment recorded – membership extended to '+df(m.end))},'Record payment');
const sel=M.querySelector('[name=planId]');sel.onchange=()=>M.querySelector('[name=amount]').value=plan(sel.value).price}
function classForm(id){const c=db.classes.find(x=>x.id==id);
form(c?'Edit class':'Schedule class',[{k:'name',l:'Class name',r:1},{k:'trainerId',l:'Trainer',t:'select',o:db.trainers.map(t=>[t.id,t.name])},{k:'day',l:'Day',t:'select',o:DAYS.map((d,i)=>[i,d])},{k:'time',l:'Time',t:'time',r:1,d:'07:00'},{k:'cap',l:'Capacity',t:'number',r:1,d:15}],c||{day:ui.day},o=>{
if(!db.trainers.length){toast('Add a trainer first',1);return false}
const cap=Math.floor(o.cap);if(c&&cap<c.booked.length){toast(`Capacity cannot be below ${c.booked.length} booked members`,1);return false}
if(db.classes.some(x=>x.id!=id&&x.trainerId==o.trainerId&&x.day==o.day&&x.time==o.time)){toast('This trainer already has a class at that time',1);return false}
const v={name:o.name,trainerId:o.trainerId,day:+o.day,time:o.time,cap};if(c)Object.assign(c,v);else db.classes.push({id:uid('k'),...v,booked:[]});save();render();toast(c?'Class updated':'Class scheduled')},c?'Save changes':'Schedule class')}
function roster(id){const c=db.classes.find(x=>x.id==id);if(!c)return close();
const av2=db.members.filter(m=>st(m)!='Expired'&&st(m)!='Frozen'&&!c.booked.includes(m.id));
modal(`<h2>${esc(c.name)} · ${DAYS[c.day]} ${c.time}</h2><p class="mu">${c.booked.length} of ${c.cap} booked</p>${c.booked.length?c.booked.map(b=>`<div class="fi">${av(mem(b)?.name||'?')}<span style="flex:1">${esc(mem(b)?.name||'Removed member')}</span><button class="bs d" data-a="unbook" data-id="${c.id}|${b}">Remove</button></div>`).join(''):'<div class="em">No bookings yet</div>'}<label style="display:block;margin-top:12px;font-weight:600">Book a member<select id="bk">${av2.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')||'<option value="">No eligible members</option>'}</select></label><div class="ra"><button class="b2" data-a="close">Close</button><button class="b" data-a="book" data-id="${c.id}">Book</button></div>`)}
function render(){const r=(location.hash||'#dashboard').slice(1);const V=R[r]||R.dashboard;
$('#nav').innerHTML=NAV.map(n=>`<a tabindex="0" role="link" data-a="go" data-id="${n[0]}" class="${n[0]==(R[r]?r:'dashboard')?'on':''}">${n[2]} ${n[1]}</a>`).join('');
$('#v').innerHTML=V();const d=db.members.filter(m=>['Expired','Expiring'].includes(st(m))).length;$('#bc').textContent=d;if(R[r]==R.members)tbl()}
const NAV=[['dashboard','Dashboard','📊'],['members','Members','👥'],['leads','Leads','🎯'],['classes','Classes','📅'],['checkins','Check-ins','✅'],['billing','Billing','💳'],['trainers','Trainers','🏋️'],['reports','Reports','📈'],['settings','Settings','⚙️']];
const kpi=(l,v)=>`<div class="k"><span>${l}</span><b>${v}</b></div>`,rev=k=>db.payments.filter(p=>p.date.slice(0,7)==mk(k)).reduce((a,p)=>a+p.amount,0);
